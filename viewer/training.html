<!doctype html>
<!-- The old training tab, split into Runs, Steps and Attempts: its links land on the tab that now shows the same view. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GRPO runs</title>
  <script>
    const query = new URLSearchParams(location.search);
    const page = !query.get("run") ? "runs.html" : query.get("step") ? "attempts.html" : "steps.html";
    location.replace(page + location.search);
  </script>
</head>
<body>
  <a href="runs.html">Runs</a>
</body>
</html>
