<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>GRPO rollouts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      overflow: hidden;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    a { color: #2196f3; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      width: 100%;
      max-width: 1400px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      gap: 18px;
    }

    .rail { flex: 0 0 190px; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
    .view { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

    nav { padding: 10px 0 4px; text-align: center; font-size: 15px; line-height: 1.7; }
    nav strong { display: block; font-size: 22px; }
    nav strong a { color: #333; }

    .summary { color: #666; text-align: center; line-height: 1.7; }
    .summary b { color: #333; }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
    }

    .open-entry { flex: 0 1 auto; min-height: 0; overflow: auto; font-size: 13px; }
    .open-entry:empty { display: none; }
    .open-field { padding: 9px 13px; border-bottom: 1px solid #e5e7eb; overflow-wrap: anywhere; }
    .open-field:last-child { border-bottom: 0; }
    .open-label { display: block; color: #87919c; }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .filters:empty { display: none; }
    .chip {
      padding: 3px 10px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .table-wrap { flex: 0 1 auto; min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; z-index: 1; background: #4a5568; }
    th {
      padding: 9px 10px;
      background: #4a5568;
      box-shadow: 1px 0 0 #4a5568;  /* covers the hairline Chrome leaves between cells at fractional widths */
      color: white;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    th.sorted-asc::after { content: " ▲"; font-size: 10px; }
    th.sorted-desc::after { content: " ▼"; font-size: 10px; }
    td { padding: 7px 10px; border-bottom: 1px solid #edf0f3; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.wrap { white-space: normal; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr.group-odd { background: #fafafa; }
    tbody tr.group-odd:hover { background: #f1f5f9; }
    .filterable:hover { text-decoration: underline; }

    .reward { display: inline-block; min-width: 38px; padding: 1px 7px; border-radius: 4px; font-weight: 600; text-align: center; }
    .reward-correct { background: #dcfce7; color: #166534; }
    .reward-partial { background: #fef3c7; color: #92400e; }
    .reward-failed { background: #fee2e2; color: #991b1b; }
    .adv-pos { color: #059669; }
    .adv-neg { color: #dc2626; }
    .muted { color: #9ca3af; }

    .tokens {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 18px;
      font: 13px/1.6 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .tokens:empty { display: none; }
    .segment-label { display: block; margin: 0 0 6px; color: #87919c; font: 600 12px/1.4 -apple-system, sans-serif; }
    .prompt { color: #6b7280; }
    details.prompt-block { margin-bottom: 16px; }
    details.prompt-block summary { cursor: pointer; color: #87919c; font: 600 12px/1.4 -apple-system, sans-serif; }
    .token { background: var(--completion-token-background, #fff9c4); border-radius: 2px; }
    .token:hover { outline: 1px solid #f59e0b; }
    .token.selected { background: #2563eb; color: white; }
    .tooltip {
      position: fixed;
      z-index: 10;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1f2937;
      color: white;
      font: 12px/1.4 ui-monospace, Menlo, monospace;
      white-space: pre;
      pointer-events: none;
    }
    .tooltip[hidden] { display: none; }
    .empty { padding: 30px; color: #6b7280; text-align: center; }
    kbd { padding: 0 4px; border: 1px solid #d1d5db; border-radius: 3px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="rail">
      <nav id="nav"></nav>
      <div class="summary" id="summary"></div>
      <div class="card open-entry" id="open-entry"></div>
    </aside>
    <main class="view">
      <div class="filters" id="filters"></div>
      <div class="card table-wrap" id="table-wrap"></div>
      <div class="card tokens" id="tokens"></div>
    </main>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <script type="module" src="rollouts.js"></script>
</body>
</html>
